paths:
  py: "python3" 
  wh_pythonpath: "/app/SimulStreaming"
  
  final_segments: "/app/final_segments.py" 

  start_services: "/app/start_services.sh"
  ct2_server: "/app/ct2_server.py"
  ct2_client: "/app/ct2_client.py"
  fix: "/app/fix-casing.py"
  last_flush: "/app/last_flush.py"
  audio: "/app/audio/Appolo_conv.wav"

  lang_manager: "/app/lang_manager.py"

  mtw: "/app/mt-wrapper/mtwrapper.py"
  whisper_server: "/app/SimulStreaming/simulstreaming_whisper_server.py"

models:
  ct2_model_dir: "/models/ct2/nllb200_1.3b_new"   #600_m_new is int8_float_16
  hf_tokenizer: "/models/hf/nllb-200-distilled-1.3B"
  whisper_model: "/models/whisper/large-v3-turbo.pt"

ports:
  ct2: 6006
  asr: 43001
  textflow: 5000
  langman: 5001          

langs: [de, ru, cs]       

ct2:
  device: cuda            #change to "cuda" in case of gpu
  inter_threads: 1     
  intra_threads: 4
  beam: 4

whisper:
  task: transcribe
  language: en
  beams: 5
  frame_threshold: 50
  vac: true
  vac_chunk_size: 0.04
  min_chunk_size: 1.5
  audio_min_len: 1.0
  audio_max_len: 15.0
  init_prompt: "Hello, everyone. Today we'll talk about physics: energy, work, and mass. Let's begin."
  log_level: INFO
